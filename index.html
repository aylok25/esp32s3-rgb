<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ESP32 Neon RGB Controller</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-color: #0088cc;
      --text-color: #ffffff;
      --c1: #ff0055;
      --c2: #00e5ff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #1a1f2c 0%, var(--bg-color) 100%);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      user-select: none;
    }

    h2 {
      margin: 4px 0 16px 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #00e5ff, #ff0055);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 3D СВІТЛОДІОДНА ЛАМПА */
    .lamp-wrapper {
      position: relative;
      margin: 10px 0 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .lamp-glow {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--c1), var(--c2));
      filter: blur(25px);
      opacity: 0.75;
      transition: all 0.3s ease;
    }

    .lamp-bulb {
      position: relative;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--c1), var(--c2));
      border: 3px solid rgba(255, 255, 255, 0.4);
      box-shadow: inset 0 8px 15px rgba(255, 255, 255, 0.5), inset 0 -8px 15px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }

    /* КАРТКИ В СТИЛІ GLASSMORPHISM */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      width: 100%;
      max-width: 350px;
      margin-bottom: 14px;
      box-sizing: border-box;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .card-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.6;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ВИБІР КОЛЬОРУ */
    .color-pickers {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .color-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.8);
    }

    .color-circle-wrapper {
      position: relative;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.05));
    }

    input[type=color] {
      -webkit-appearance: none;
      border: none;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }
    input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type=color]::-webkit-color-swatch {
      border: none;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    /* СІТКА КНОПОК */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .btn {
      padding: 11px 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active { transform: scale(0.96); }

    .btn.active {
      background: linear-gradient(135deg, #0088cc, #0055ff);
      color: #ffffff;
      border-color: rgba(255,255,255,0.4);
      box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
      font-weight: 700;
    }

    /* ПОЛЗУНКИ */
    .slider-group { margin-bottom: 12px; }
    .slider-group:last-child { margin-bottom: 0; }
    
    label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: rgba(255, 255, 255, 0.8);
    }

    input[type=range] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.1);
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      border: 2px solid var(--accent-color);
      transition: transform 0.1s ease;
    }

    input[type=range]::-webkit-slider-thumb:active {
      transform: scale(1.2);
    }

    /* ГОЛОВНІ КНОПКИ */
    .btn-apply {
      width: 100%;
      max-width: 350px;
      padding: 16px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 114, 255, 0.4);
      transition: all 0.2s ease;
      margin-top: 4px;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .btn-apply:active { transform: scale(0.98); opacity: 0.9; }

    .btn-off {
      width: 100%;
      max-width: 350px;
      padding: 12px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid rgba(255, 59, 48, 0.3);
      border-radius: 12px;
      background: rgba(255, 59, 48, 0.1);
      color: #ff4d4d;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-off:active { transform: scale(0.97); background: rgba(255, 59, 48, 0.25); }
  </style>
</head>
<body>

  <h2>ESP32 Smart Control</h2>

  <!-- ЖИВА 3D ЛАМПА -->
  <div class="lamp-wrapper">
    <div class="lamp-glow" id="glow"></div>
    <div class="lamp-bulb" id="bulb"></div>
  </div>

  <!-- ПАЛІТРА КОЛЬОРІВ -->
  <div class="card">
    <div class="card-title">🎨 Палітра кольорів</div>
    <div class="color-pickers">
      <div class="color-box">
        <span>Основний</span>
        <div class="color-circle-wrapper">
          <input type="color" id="color1" value="#ff0055" oninput="updateUI()">
        </div>
      </div>
      <div class="color-box">
        <span>Додатковий</span>
        <div class="color-circle-wrapper">
          <input type="color" id="color2" value="#00e5ff" oninput="updateUI()">
        </div>
      </div>
    </div>
  </div>

  <!-- РЕЖИМИ ЕФЕКТІВ -->
  <div class="card">
    <div class="card-title">✨ Режими ефектів</div>
    <div class="grid-2">
      <button class="btn active" onclick="selectMode(1, this)">🛑 Статика</button>
      <button class="btn" onclick="selectMode(2, this)">⚡ Миготіння</button>
      <button class="btn" onclick="selectMode(3, this)">🌊 Дихання</button>
      <button class="btn" onclick="selectMode(4, this)">🔀 Змішування</button>
      <button class="btn" onclick="selectMode(5, this)">🌈 Веселка</button>
      <button class="btn" onclick="selectMode(6, this)">🚨 Поліція</button>
      <button class="btn" onclick="selectMode(7, this)" style="grid-column: span 2;">🔥 Живий Вогонь / Свічка</button>
    </div>
  </div>

  <!-- ГОТОВІ ПРЕСЕТИ -->
  <div class="card">
    <div class="card-title">🌅 Атмосферні теми</div>
    <div class="grid-2">
      <button class="btn" onclick="applyPreset('#ff5500', '#800080', 4)">🌅 Захід сонця</button>
      <button class="btn" onclick="applyPreset('#00ffcc', '#0022ff', 4)">🌊 Океан</button>
      <button class="btn" onclick="applyPreset('#ff0099', '#00dcff', 4)">🌆 Кіберпанк</button>
      <button class="btn" onclick="applyPreset('#32ff32', '#006414', 4)">🌲 Неоновий ліс</button>
    </div>
  </div>

  <!-- НАЛАШТУВАННЯ -->
  <div class="card">
    <div class="card-title">⚙️ Налаштування світла</div>
    <div class="slider-group">
      <label>Яскравість <span id="bright-val">50%</span></label>
      <input type="range" id="brightness" min="5" max="100" value="50" oninput="updateUI()">
    </div>
    <div class="slider-group" style="margin-top: 10px;">
      <label>Швидкість ефектів <span id="speed-val">Середня 🚶</span></label>
      <input type="range" id="speed" min="1" max="3" value="2" oninput="updateUI()">
    </div>
  </div>

  <button class="btn-apply" onclick="sendData()">Застосувати налаштування ✨</button>
  <button class="btn-off" onclick="turnOff()">Вимкнути світлодіод ⬛</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentMode = 1;

    const c1 = document.getElementById('color1');
    const c2 = document.getElementById('color2');
    const bright = document.getElementById('brightness');
    const speed = document.getElementById('speed');
    const bulb = document.getElementById('bulb');
    const glow = document.getElementById('glow');

    const speedLabels = {1: 'Повільно 🐢', 2: 'Середня 🚶', 3: 'Швидко 🚀'};

    function hexToRgb(hex) {
      const bigint = parseInt(hex.replace('#', ''), 16);
      return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
    }

    function updateUI() {
      // Оновлюємо текст яскравості та швидкості
      document.getElementById('bright-val').innerText = bright.value + '%';
      document.getElementById('speed-val').innerText = speedLabels[speed.value];

      // Оновлюємо CSS змінні кольорів для лампи
      document.documentElement.style.setProperty('--c1', c1.value);
      document.documentElement.style.setProperty('--c2', c2.value);

      // Зміна прозорості світіння лампи відповідно до яскравості
      const opacity = bright.value / 100;
      glow.style.opacity = opacity * 0.8;
      bulb.style.opacity = Math.max(0.3, opacity);
    }

    function selectMode(mode, btn) {
      currentMode = mode;
      document.querySelectorAll('.grid-2 .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      // Вібрація при виборі (підтримується в Telegram WebApp)
      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }
    }

    function applyPreset(hex1, hex2, mode) {
      c1.value = hex1;
      c2.value = hex2;
      currentMode = mode;
      updateUI();
      sendData();
    }

    function sendData() {
      if (tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }
      const rgb1 = hexToRgb(c1.value);
      const rgb2 = hexToRgb(c2.value);
      const command = `CMD:${currentMode},${rgb1.r},${rgb1.g},${rgb1.b},${rgb2.r},${rgb2.g},${rgb2.b},${bright.value},${speed.value}`;
      tg.sendData(command);
    }

    function turnOff() {
      if (tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('warning');
      }
      tg.sendData("CMD:0,0,0,0,0,0,0,0,1");
    }

    // Ініціалізація початкового вигляду
    updateUI();
  </script>
</body>
</html>
