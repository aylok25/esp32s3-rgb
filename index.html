<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 RGB Controller</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #121212);
      color: var(--tg-theme-text-color, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
      box-sizing: border-box;
    }
    h2 { margin-top: 0; margin-bottom: 15px; font-size: 22px; }
    
    .preview-box {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      background-color: rgb(255, 0, 0);
      transition: background-color 0.1s ease;
      border: 3px solid rgba(255,255,255,0.2);
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 340px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      opacity: 0.7;
      margin-bottom: 12px;
    }

    .slider-group { margin-bottom: 12px; }
    .slider-group:last-child { margin-bottom: 0; }
    
    label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type=range] {
      width: 100%;
      height: 8px;
      border-radius: 4px;
      outline: none;
      -webkit-appearance: none;
      background: #333;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    #red { accent-color: #ff4d4d; }
    #green { accent-color: #4dff4d; }
    #blue { accent-color: #4d4dff; }
    #brightness { accent-color: #ffaa00; }
    #speed { accent-color: #00ccff; }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .mode-btn {
      padding: 12px 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: inherit;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border-color: transparent;
    }

    .btn-apply {
      width: 100%;
      max-width: 340px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 10px;
    }

    .btn-off {
      width: 100%;
      max-width: 340px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background-color: rgba(255, 59, 48, 0.2);
      color: #ff4d4d;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>🎛️ Пульт ESP32-S3</h2>
  <div id="preview" class="preview-box"></div>

  <!-- РЕЖИМИ -->
  <div class="card">
    <div class="card-title">✨ Режим роботи</div>
    <div class="mode-grid">
      <button class="mode-btn active" onclick="selectMode(1, this)">🛑 Статика</button>
      <button class="mode-btn" onclick="selectMode(2, this)">⚡ Миготіння</button>
      <button class="mode-btn" onclick="selectMode(3, this)">🌊 Дихання</button>
      <button class="mode-btn" onclick="selectMode(4, this)">🌈 Веселка</button>
    </div>
  </div>

  <!-- КОЛІР -->
  <div class="card">
    <div class="card-title">🎨 Палітра кольору (RGB)</div>
    <div class="slider-group">
      <label>Червоний: <span id="r-val">255</span></label>
      <input type="range" id="red" min="0" max="255" value="255">
    </div>
    <div class="slider-group">
      <label>Зелений: <span id="g-val">0</span></label>
      <input type="range" id="green" min="0" max="255" value="0">
    </div>
    <div class="slider-group">
      <label>Синій: <span id="b-val">0</span></label>
      <input type="range" id="blue" min="0" max="255" value="0">
    </div>
  </div>

  <!-- НАЛАШТУВАННЯ -->
  <div class="card">
    <div class="card-title">⚙️ Налаштування</div>
    <div class="slider-group">
      <label>Яскравість: <span id="bright-val">50%</span></label>
      <input type="range" id="brightness" min="5" max="100" value="50">
    </div>
    <div class="slider-group" style="margin-top: 10px;">
      <label>Швидкість ефектів: <span id="speed-val">Середня 🚶</span></label>
      <input type="range" id="speed" min="1" max="3" value="2">
    </div>
  </div>

  <button class="btn-apply" onclick="sendData()">Застосувати ✨</button>
  <button class="btn-off" onclick="turnOff()">Вимкнути світлодіод ⬛</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentMode = 1; // 1=Solid, 2=Blink, 3=Fade, 4=Rainbow

    const r = document.getElementById('red');
    const g = document.getElementById('green');
    const b = document.getElementById('blue');
    const bright = document.getElementById('brightness');
    const speed = document.getElementById('speed');
    const preview = document.getElementById('preview');

    const speedLabels = {1: 'Повільно 🐢', 2: 'Середня 🚶', 3: 'Швидко 🚀'};

    function updateUI() {
      document.getElementById('r-val').innerText = r.value;
      document.getElementById('g-val').innerText = g.value;
      document.getElementById('b-val').innerText = b.value;
      document.getElementById('bright-val').innerText = bright.value + '%';
      document.getElementById('speed-val').innerText = speedLabels[speed.value];
      
      preview.style.backgroundColor = `rgb(${r.value}, ${g.value}, ${b.value})`;
    }

    function selectMode(mode, btn) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    r.addEventListener('input', updateUI);
    g.addEventListener('input', updateUI);
    b.addEventListener('input', updateUI);
    bright.addEventListener('input', updateUI);
    speed.addEventListener('input', updateUI);

    function sendData() {
      // Формат: CMD:mode,r,g,b,brightness,speed
      const command = `CMD:${currentMode},${r.value},${g.value},${b.value},${bright.value},${speed.value}`;
      tg.sendData(command);
    }

    function turnOff() {
      tg.sendData("CMD:0,0,0,0,0,1");
    }

    updateUI();
  </script>
</body>
</html>
