<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ESP32 OLED Cyber Controller</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #05070a;
      --card-bg: #0d1117;
      --card-border: #1f293d;
      --c1: #ff0055;
      --c2: #00e5ff;
      --accent: #00f0ff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
      background-color: var(--bg);
      color: #f0f6fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      user-select: none;
    }

    /* HEADER & CYBER ORB */
    .header-title {
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #00f0ff, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 4px 0 12px 0;
    }

    .orb-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
    }

    .orb-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--c1), var(--c2), var(--c1));
      filter: blur(12px);
      opacity: 0.7;
      animation: rotate 6s linear infinite;
    }

    .orb-core {
      position: relative;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--c1), var(--c2));
      border: 2px solid rgba(255, 255, 255, 0.5);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px var(--c1);
      transition: all 0.3s ease;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* CARD CONTAINERS */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      width: 100%;
      max-width: 350px;
      margin-bottom: 12px;
      box-sizing: border-box;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .card-head {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8b949e;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* COLOR PICKERS */
    .color-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .color-picker-btn {
      background: #161b22;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .color-picker-btn span {
      font-size: 12px;
      font-weight: 600;
      color: #c9d1d9;
    }

    input[type=color] {
      -webkit-appearance: none;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }
    input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type=color]::-webkit-color-swatch {
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 50%;
    }

    /* GRID BUTTONS */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

    .btn {
      background: #161b22;
      border: 1px solid var(--card-border);
      color: #c9d1d9;
      padding: 10px 6px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .btn:active { transform: scale(0.96); }

    .btn.active {
      background: linear-gradient(135deg, #00f0ff, #0077ff);
      color: #000000;
      border-color: #00f0ff;
      font-weight: 800;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    .preset-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      padding: 8px 4px;
    }

    /* SLIDERS */
    .slider-box { margin-bottom: 10px; }
    .slider-box:last-child { margin-bottom: 0; }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: #8b949e;
      margin-bottom: 6px;
    }

    .slider-label .val { color: var(--accent); font-weight: 700; }

    input[type=range] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
      background: #21262d;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00f0ff;
      cursor: pointer;
      box-shadow: 0 0 10px #00f0ff;
    }

    /* ACTION BUTTONS */
    .btn-main {
      width: 100%;
      max-width: 350px;
      padding: 15px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, #00f0ff, #7000ff);
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(112, 0, 255, 0.4);
      margin-top: 4px;
      margin-bottom: 8px;
    }

    .btn-main:active { transform: scale(0.98); opacity: 0.9; }

    .btn-off {
      width: 100%;
      max-width: 350px;
      padding: 11px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(255, 69, 58, 0.3);
      border-radius: 12px;
      background: rgba(255, 69, 58, 0.08);
      color: #ff453a;
      cursor: pointer;
    }

    .btn-off:active { transform: scale(0.97); background: rgba(255, 69, 58, 0.2); }
  </style>
</head>
<body>

  <div class="header-title">ESP32 CYBER CONTROL</div>

  <!-- CYBER ORB VISUALIZER -->
  <div class="orb-wrapper">
    <div class="orb-ring"></div>
    <div class="orb-core" id="orbCore"></div>
  </div>

  <!-- COLOR SELECTION -->
  <div class="card">
    <div class="card-head"><span>🎨 Палітра змішування</span></div>
    <div class="color-row">
      <div class="color-picker-btn">
        <span>Основний</span>
        <input type="color" id="color1" value="#ff0055" oninput="updateUI()">
      </div>
      <div class="color-picker-btn">
        <span>Додатковий</span>
        <input type="color" id="color2" value="#00e5ff" oninput="updateUI()">
      </div>
    </div>
  </div>

  <!-- MODES -->
  <div class="card">
    <div class="card-head"><span>⚡ Вибір ефекту</span></div>
    <div class="grid-2">
      <button class="btn active" onclick="selectMode(1, this)">🛑 Статика</button>
      <button class="btn" onclick="selectMode(2, this)">⚡ Миготіння</button>
      <button class="btn" onclick="selectMode(3, this)">🌊 Дихання</button>
      <button class="btn" onclick="selectMode(4, this)">🔀 Змішування</button>
      <button class="btn" onclick="selectMode(5, this)">🌈 Веселка</button>
      <button class="btn" onclick="selectMode(6, this)">🚨 Поліція</button>
      <button class="btn" onclick="selectMode(7, this)" style="grid-column: span 2;">🔥 Живий Вогонь / Свічка</button>
    </div>
  </div>

  <!-- 10 PRESETS -->
  <div class="card">
    <div class="card-head"><span>🌅 Готові атмосферні теми</span></div>
    <div class="grid-2">
      <button class="btn preset-btn" onclick="applyPreset('#ff5500', '#800080', 4)">🌅 Захід сонця</button>
      <button class="btn preset-btn" onclick="applyPreset('#00ffcc', '#0022ff', 4)">🌊 Океан</button>
      <button class="btn preset-btn" onclick="applyPreset('#ff0099', '#00dcff', 4)">🌆 Кіберпанк</button>
      <button class="btn preset-btn" onclick="applyPreset('#32ff32', '#006414', 4)">🌲 Магічний ліс</button>
      <button class="btn preset-btn" onclick="applyPreset('#00ffaa', '#9900ff', 4)">🌌 Сяйво</button>
      <button class="btn preset-btn" onclick="applyPreset('#ff1100', '#ff8800', 4)">🌋 Рідка лава</button>
      <button class="btn preset-btn" onclick="applyPreset('#a0e7e5', '#ffffff', 4)">❄️ Арктика</button>
      <button class="btn preset-btn" onclick="applyPreset('#e0b0ff', '#8a2be2', 4)">💜 Лаванда</button>
      <button class="btn preset-btn" onclick="applyPreset('#ff6b6b', '#ffe66d', 4)">🍑 Персик</button>
      <button class="btn preset-btn" onclick="applyPreset('#0000ff', '#ff00ff', 4)">🪩 Диско-паті</button>
    </div>
  </div>

  <!-- SLIDERS -->
  <div class="card">
    <div class="card-head"><span>⚙️ Параметри</span></div>
    <div class="slider-box">
      <div class="slider-label"><span>Яскравість</span><span class="val" id="bright-val">50%</span></div>
      <input type="range" id="brightness" min="5" max="100" value="50" oninput="updateUI()">
    </div>
    <div class="slider-box" style="margin-top: 12px;">
      <div class="slider-label"><span>Швидкість ефекту</span><span class="val" id="speed-val">50%</span></div>
      <input type="range" id="speed" min="1" max="100" value="50" oninput="updateUI()">
    </div>
  </div>

  <button class="btn-main" onclick="sendData()">ЗАСТОСУВАТИ НАЛАШТУВАННЯ ✨</button>
  <button class="btn-off" onclick="turnOff()">ВИМКНУТИ СВІТЛОДІОД ⬛</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentMode = 1;

    const c1 = document.getElementById('color1');
    const c2 = document.getElementById('color2');
    const bright = document.getElementById('brightness');
    const speed = document.getElementById('speed');
    const orbCore = document.getElementById('orbCore');

    function hexToRgb(hex) {
      const bigint = parseInt(hex.replace('#', ''), 16);
      return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
    }

    function updateUI() {
      document.getElementById('bright-val').innerText = bright.value + '%';
      document.getElementById('speed-val').innerText = speed.value + '%';

      document.documentElement.style.setProperty('--c1', c1.value);
      document.documentElement.style.setProperty('--c2', c2.value);

      const opacity = bright.value / 100;
      orbCore.style.opacity = Math.max(0.2, opacity);
    }

    function selectMode(mode, btn) {
      currentMode = mode;
      document.querySelectorAll('.grid-2 .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }
    }

    function applyPreset(hex1, hex2, mode) {
      c1.value = hex1;
      c2.value = hex2;
      currentMode = mode;
      updateUI();
      sendData();
    }

    function sendData() {
      if (tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }
      const rgb1 = hexToRgb(c1.value);
      const rgb2 = hexToRgb(c2.value);
      const command = `CMD:${currentMode},${rgb1.r},${rgb1.g},${rgb1.b},${rgb2.r},${rgb2.g},${rgb2.b},${bright.value},${speed.value}`;
      tg.sendData(command);
    }

    function turnOff() {
      if (tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('warning');
      }
      tg.sendData("CMD:0,0,0,0,0,0,0,0,50");
    }

    updateUI();
  </script>
</body>
</html>
